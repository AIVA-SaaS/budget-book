server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aiva-bb.duckdns.org;

    ssl_certificate /usr/syno/etc/certificate/_archive/DOaRet/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/_archive/DOaRet/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/services/web_bb;
    index index.html;

    # API proxy
    location ^~ /api/ {
        proxy_connect_timeout 60;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:8081;
    }

    # OAuth2 proxy
    location ^~ /oauth2/ {
        proxy_connect_timeout 60;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:8081;
    }

    # Login OAuth2 callback
    location ^~ /login/ {
        proxy_connect_timeout 60;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:8081;
    }

    # Actuator
    location ^~ /actuator/ {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket
    location ^~ /ws {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # ── Override global gzip off (ssl.compress.conf) for static assets ──
    # 관리: repo ops/nas-nginx/aiva-bb.conf (Phase 25 성능 회복)
    # comp_level 4: NAS CPU 저사양에서 실시간 인코딩 부담 경감 (크기 차이 미미).
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-sfnt
        application/vnd.ms-fontobject;

    # ── Cache policy (Phase 25 Step 0.6) ──
    # Flutter web 은 main.dart.js 파일명이 고정이라 브라우저가 stale 번들을
    # 계속 서빙하는 문제가 있음. 엔트리 포인트만 no-cache 로 설정해 배포 즉시
    # 새 버전 감지. ETag 기반 304 응답으로 실제 전송량은 최소화.
    #
    # location = /index.html 은 try_files 가 SPA fallback 으로 넘길 때
    # 내부 재매칭되어 deep link 도 no-cache 헤더가 붙음.

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ~ ^/(flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # /assets 라우트 충돌 해소 (Phase 25 Step 2 — Flutter 라우트 vs 빌드 산출물 디렉터리)
    # Flutter 빌드의 /assets/ 디렉터리는 정적 리소스 (이미지/폰트). 그대로 두면
    # /assets → 301 → /assets/ → 403 디렉터리 접근 차단됨. exact match 로 override.
    # /assets/<file> 는 `location /` try_files 로 기존대로 서빙 (변화 없음).
    location = /assets {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # ── Static fonts — MIME override(gzip 용) + 재검증 캐시 ──
    # 1차 시도(PR #153) 실패 원인:
    #   - Flutter web asset URL 이 /assets/assets/fonts/ (중복 /assets/) 인데
    #     location prefix 를 /assets/fonts/ 로 작성 → 매칭 실패
    #   - nginx 가 .ttf 를 application/octet-stream 으로 서빙 → gzip_types
    #     매칭 실패 → gzip 미적용 (10MB 원본 그대로 전송)
    # → 확장자 정규식으로 경로 독립 매칭 + MIME 강제 override 로 해결(유지).
    #
    # 2026-07-27 — immutable 제거. **전제가 틀렸다.**
    #   이전 주석: "빌드 산출물은 변경 시 새 URL 이라 immutable 안전"
    #   실제: Flutter web 은 --tree-shake-icons 로 **매 빌드 내용이 달라지는** 아이콘 폰트를
    #   /assets/fonts/MaterialIcons-Regular.otf 라는 **해시 없는 고정 URL** 로 내보낸다.
    #   immutable 은 만료 전 재검증을 하지 않으므로 재방문 클라이언트가 구 빌드의 서브셋
    #   폰트를 계속 써서 **새로 추가된 아이콘만 빈칸**이 된다
    #   (V65 정산 아이콘 fact_check/check_circle. PR #251 계산기 아이콘과 동일 계열의 2회차).
    #   폰트는 37KB 수준이고 ETag 304 로 재검증되므로 no-cache 비용은 무시할 만하다.
    #
    # 2026-07-30 — 헤더만으로는 부족했다(3회차). **이미 immutable 로 캐시한 클라이언트는
    #   재검증 요청 자체를 하지 않아** 위 fix 가 도달하지 않는다(정산 아이콘만 빈칸 지속).
    #   근본 원인은 캐시 정책이 아니라 URL 신원 ≠ 내용 신원이므로, 배포 파이프라인이
    #   아이콘 폰트 파일명에 content hash 를 넣는다(infra/scripts/hash-icon-font.sh).
    #   그래도 이 location 은 no-cache 를 유지한다 — 프로젝트 폰트(NotoSansKR-Subset.woff2)는
    #   여전히 해시 없는 고정 URL 이고, 확장자 정규식은 둘을 구분하지 않는다.
    #
    # 이 정책은 infra/scripts/verify-cache-headers.sh 가 배포 후 실제 응답 헤더로 검증한다
    # (아이콘 폰트는 FontManifest 경로의 content hash 존재까지 함께 검증).
    location ~* \.(ttf|otf|woff|woff2)$ {
        types {
            font/ttf ttf;
            font/otf otf;
            font/woff woff;
            font/woff2 woff2;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        # 2026-06-05 — main.dart.js 등 content-hash 없는 번들이 위 no-cache
        # 정규식(flutter_bootstrap/service_worker/version.json)에 빠져 stale
        # 캐시되던 문제. 모바일 브라우저가 구버전 main.dart.js 를 잡고 있어 신규
        # UI(계산기 아이콘 등)가 노출되지 않았음. hashless 산출물 전체를 no-cache
        # 로 커버한다. 폰트(~* ttf/otf/woff)는 location 정규식이 우선하므로 그쪽 블록에서
        # 같은 정책을 명시한다 (2026-07-27 정산 아이콘 미노출 후 immutable → no-cache).
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name aiva-bb.duckdns.org;
    # Let's Encrypt HTTP-01 challenge (DSM 이 /var/lib/letsencrypt 에 토큰 배치)
    location ^~ /.well-known/acme-challenge {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

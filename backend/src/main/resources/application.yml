spring:
  application:
    name: budget-book

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info

# Task #18: Sentry error monitoring (disabled when SENTRY_DSN env var is not set)
# Required GitHub Secret / Render env var: SENTRY_DSN
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5000}

name: budget_book
description: Shared household budget management app for couples.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.69.0

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Functional Programming
  dartz: ^0.10.1

  # WebSocket
  web_socket_channel: ^3.0.1
  stomp_dart_client: ^2.0.0

  # Localization
  intl: any

  # Image picking
  image_picker: ^1.0.0

  # Connectivity
  connectivity_plus: ^6.0.0

  # Utils
  uuid: ^4.5.1
  logger: ^2.4.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0

  # Task #18: Sentry error monitoring (disabled when SENTRY_DSN dart-define is not set)
  sentry_flutter: ^8.10.1

  # Web platform
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mockito: ^5.4.4
  mocktail: ^1.0.4
  build_runner: ^2.4.12
  injectable_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSansKR
      fonts:
        # 한글(AC00-D7AF) + Jamo + 라틴 + 통화 subset, woff2 변환.
        # 원본 NotoSansKR-VF.ttf 10MB → subset 1.2MB (gzip 후 동일, woff2 가
        # 이미 brotli 내장이라 추가 압축 효과 없음). 한자(Hanja) 제외.
        # 재생성: ops/fonts/build-noto-subset.sh
        - asset: assets/fonts/NotoSansKR-Subset.woff2

  assets:
    - assets/images/
    - assets/icons/

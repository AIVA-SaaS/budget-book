name: Frontend CI

on:
  push:
    # Task #16: Added feature/**, fix/**, chore/** so CI runs on feature branches before PR
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**']
    paths: ['frontend/**']
  pull_request:
    branches: [main, develop]
    paths: ['frontend/**']

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          if find test -name "*_test.dart" | grep -q .; then
            flutter test --no-pub
          else
            echo "No test files found, skipping"
          fi

      - name: Build Web
        run: flutter build web --release

      - name: Create Issue on Failure (main only, skip if open issue exists)
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            // Check for existing open ci-failure issues
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure,frontend',
              state: 'open',
              per_page: 1,
            });
            if (issues.length > 0) {
              console.log(`Skipping: open issue #${issues[0].number} already exists`);
              return;
            }
            const title = `[CI FAIL] Frontend - ${context.sha.substring(0, 7)}`;
            const body = [
              '## CI Failure Report',
              '',
              `**Commit:** ${context.sha}`,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Action Required',
              '- [ ] 에러 로그 확인 후 수정',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'frontend'],
            });

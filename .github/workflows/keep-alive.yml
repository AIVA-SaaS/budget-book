name: Keep Alive - Render Cold Start Prevention

on:
  schedule:
    # Every 5 minutes to prevent Render free tier 15-min sleep
    # GitHub Actions cron can delay 5-15min, so 5min interval ensures
    # at least one successful ping within any 15-min window
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 30 --max-time 90 \
            https://budget-book-api.onrender.com/actuator/health 2>/dev/null || echo "000")

          echo "Health endpoint returned: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "Backend is awake and healthy."
          elif [ "$STATUS" = "000" ]; then
            echo "Backend did not respond (timeout or network error). Render may be starting up."
          else
            echo "Backend returned unexpected status: $STATUS"
          fi

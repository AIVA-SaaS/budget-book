name: Deploy to NAS

# 변경 부위만 배포 (frontend/backend 독립). CI 에서 이미 검증된 코드 가정.
# Test gates 제거 — ci-backend.yml / ci-frontend.yml 가 PR 단계에서 차단.
# 직접 main push 시에도 deploy 자체가 health check 로 fail-fast 가능.
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  # ── 변경 감지: backend/frontend 영역별 분리 ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-nas.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-nas.yml'

  # ── Backend 배포 (변경 시에만) ──
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to NAS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USERNAME }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            export PATH=/usr/local/bin:$PATH
            cd /volume1/docker/budget-book

            git fetch origin main --depth=1
            git reset --hard origin/main

            cd backend
            # NAS Docker 엔진에 buildx 미설치 → legacy builder 사용.
            # 동일 태그 재사용으로 Docker 가 layer cache 자동 활용.
            docker build -t bb-backend:latest .

            cat > /tmp/bb_env << 'ENVEOF'
            SPRING_PROFILES_ACTIVE=prod
            SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5433/budgetbook?sslmode=disable
            DB_HOST=host.docker.internal
            DB_PORT=5433
            DB_NAME=budgetbook
            DB_USERNAME=budgetbook
            DB_PASSWORD=${{ secrets.NAS_DB_PASSWORD }}
            JWT_SECRET=${{ secrets.NAS_JWT_SECRET }}
            FRONTEND_URL=https://aiva-bb.duckdns.org
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            REDIS_URL=redis://host.docker.internal:6380
            FLYWAY_ENABLED=true
            SERVER_FORWARD_HEADERS_STRATEGY=framework
            SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER=X-Forwarded-Proto
            ENVEOF
            sed -i 's/^            //' /tmp/bb_env

            docker stop bb_app 2>/dev/null || true
            docker rm bb_app 2>/dev/null || true
            docker run -d \
              --name bb_app \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 8081:8080 \
              --env-file /tmp/bb_env \
              bb-backend:latest

            # Health check — 빠른 실패 (5회 × 6s = 30s 안에 결정)
            for i in $(seq 1 5); do
              sleep 6
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Backend UP (attempt $i)"
                exit 0
              fi
            done
            echo "FAILED: Backend did not start"
            docker logs --tail 30 bb_app
            exit 1

  # ── Frontend 배포 (변경 시에만) ──
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (release, tree-shake)
        run: flutter build web --release --dart-define=API_BASE_URL=https://aiva-bb.duckdns.org

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/nas_key
          chmod 600 ~/.ssh/nas_key
          ssh-keyscan -p ${{ secrets.NAS_SSH_PORT }} ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package and deploy to NAS
        run: |
          cd build/web
          tar czf /tmp/bb-web.tar.gz .
          scp -O -i ~/.ssh/nas_key -P ${{ secrets.NAS_SSH_PORT }} \
            /tmp/bb-web.tar.gz ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/tmp/bb-web.tar.gz
          ssh -i ~/.ssh/nas_key -p ${{ secrets.NAS_SSH_PORT }} \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} \
            "sudo rm -rf /var/services/web_bb/* && cd /var/services/web_bb && sudo tar xzf /tmp/bb-web.tar.gz && sudo chown -R admin:users /var/services/web_bb && rm /tmp/bb-web.tar.gz && test -f /var/services/web_bb/index.html && echo 'Frontend deployed'"

  # ── Verify (실제 배포된 작업이 있을 때만) ──
  verify:
    needs: [changes, deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site
        run: |
          # nginx reload / JVM warm-up 대기 (기존 5초 → 2초)
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://aiva-bb.duckdns.org/ || echo "000")
          API=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://aiva-bb.duckdns.org/actuator/health || echo "000")
          echo "Site=$STATUS API=$API"
          [ "$STATUS" = "200" ] && [ "$API" = "200" ]

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'deploy-failure', state: 'open', per_page: 1,
            });
            if (issues.length > 0) {
              console.log(`Skipping: open issue #${issues[0].number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[DEPLOY FAIL] ${context.sha.substring(0, 7)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deploy-failure'],
            });

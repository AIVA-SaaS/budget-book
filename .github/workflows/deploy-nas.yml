name: Deploy to NAS

# 변경 부위만 배포 (frontend/backend 독립). CI 에서 이미 검증된 코드 가정.
# Test gates 제거 — ci-backend.yml / ci-frontend.yml 가 PR 단계에서 차단.
# 직접 main push 시에도 deploy 자체가 health check 로 fail-fast 가능.
on:
  push:
    branches: [main]

# 2026-04-26 deploy fail 분석: 병렬 머지 시 동일 NAS 의 /tmp/bb-deploy 폴더 충돌.
# concurrency group 으로 NAS deploy 를 직렬화. 새 push 시 진행 중인 run 취소 안 함
# (cancel-in-progress=false) — 모두 차례로 완료.
concurrency:
  group: deploy-nas
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # ── 변경 감지: backend/frontend 영역별 분리 ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-nas.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-nas.yml'
            nginx:
              - 'ops/nas-nginx/**'
              - '.github/workflows/deploy-nas.yml'

  # ── Backend 배포 (변경 시에만) ──
  # E-2 (2026-04-26): GitHub Actions runner 에서 gradle bootJar 실행 (cache 활용)
  # → JAR + 경량 runtime Dockerfile 만 SSH 로 NAS 전송. NAS 는 image build 만 (jre + jar).
  # 기존: NAS 컨테이너 안에서 매 빌드 fresh gradle (5m20s) → 7m12s 총.
  # 신: Actions cache hit 시 gradle ~30s + scp ~10s + image build ~10s + health ~30s ≈ 1-2m.
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Locate JAR
        id: jar
        run: |
          JAR=$(ls build/libs/*-SNAPSHOT.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then JAR=$(ls build/libs/*.jar | grep -v plain | head -1); fi
          if [ -z "$JAR" ]; then echo "ERR: no jar" >&2; exit 1; fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built: $JAR ($(du -h "$JAR" | cut -f1))"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/nas_key
          chmod 600 ~/.ssh/nas_key
          ssh-keyscan -p ${{ secrets.NAS_SSH_PORT }} ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Generate runtime Dockerfile
        run: |
          cat > /tmp/Dockerfile.runtime << 'EOF'
          FROM eclipse-temurin:21-jre-alpine
          RUN addgroup -S app && adduser -S app -G app
          WORKDIR /app
          COPY app.jar app.jar
          USER app
          EXPOSE 8080
          ENTRYPOINT ["java", \
            "-Xms128m", "-Xmx384m", \
            "-XX:+UseSerialGC", \
            "-XX:+TieredCompilation", "-XX:TieredStopAtLevel=1", \
            "-Dspring.jmx.enabled=false", \
            "-jar", "app.jar"]
          EOF

      - name: Transfer JAR + Dockerfile to NAS
        run: |
          ssh -i ~/.ssh/nas_key -p ${{ secrets.NAS_SSH_PORT }} \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} \
            'rm -rf /tmp/bb-deploy && mkdir -p /tmp/bb-deploy'
          scp -O -i ~/.ssh/nas_key -P ${{ secrets.NAS_SSH_PORT }} \
            "${{ steps.jar.outputs.path }}" \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/tmp/bb-deploy/app.jar
          scp -O -i ~/.ssh/nas_key -P ${{ secrets.NAS_SSH_PORT }} \
            /tmp/Dockerfile.runtime \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/tmp/bb-deploy/Dockerfile

      - name: Build image + restart container on NAS
        env:
          NAS_DB_PASSWORD: ${{ secrets.NAS_DB_PASSWORD }}
          NAS_JWT_SECRET: ${{ secrets.NAS_JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # env 파일을 SSH 경유로 NAS 에 작성 (secrets 노출 최소화: stdin heredoc).
          ssh -i ~/.ssh/nas_key -p ${{ secrets.NAS_SSH_PORT }} \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} \
            "cat > /tmp/bb_env" << ENVEOF
          SPRING_PROFILES_ACTIVE=prod
          SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5433/budgetbook?sslmode=disable
          DB_HOST=host.docker.internal
          DB_PORT=5433
          DB_NAME=budgetbook
          DB_USERNAME=budgetbook
          DB_PASSWORD=${NAS_DB_PASSWORD}
          JWT_SECRET=${NAS_JWT_SECRET}
          FRONTEND_URL=https://aiva-bb.duckdns.org
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          REDIS_URL=redis://host.docker.internal:6380
          FLYWAY_ENABLED=true
          SERVER_FORWARD_HEADERS_STRATEGY=framework
          SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER=X-Forwarded-Proto
          ENVEOF

          # 빌드 + 컨테이너 재기동 + health check
          ssh -i ~/.ssh/nas_key -p ${{ secrets.NAS_SSH_PORT }} \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} \
            'set -e
             export PATH=/usr/local/bin:$PATH
             cd /tmp/bb-deploy
             docker build -t bb-backend:latest .
             docker stop bb_app 2>/dev/null || true
             docker rm bb_app 2>/dev/null || true
             docker run -d \
               --name bb_app \
               --restart unless-stopped \
               --add-host=host.docker.internal:host-gateway \
               -p 8081:8080 \
               --env-file /tmp/bb_env \
               bb-backend:latest
             # Health check — Flyway/Hibernate 마이그레이션 여유 (20회 × 6s = 120s)
             # 배치 1 A-1 (2026-04-26): Spring Boot 가 60s 넘어 70~80s 시작하는 케이스
             # (#182 deploy fail 원인) 대응. timeout 완화.
             for i in $(seq 1 20); do
               sleep 6
               STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health 2>/dev/null || echo "000")
               if [ "$STATUS" = "200" ]; then
                 echo "Backend UP (attempt $i)"
                 # cleanup
                 rm -rf /tmp/bb-deploy /tmp/bb_env
                 exit 0
               fi
             done
             echo "FAILED: Backend did not start"
             docker logs --tail 60 bb_app
             exit 1'

  # ── Frontend 배포 (변경 시에만) ──
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (release, no PWA SW)
        # 회차 12 follow-up (2026-05-04) — PWA cache stale 회귀 fix.
        # `--pwa-strategy=none`: Service Worker 등록 생략 → asset 매번 fetch
        # (브라우저 자체 cache 활용). 새 빌드 즉시 반영.
        # 회차 10 의 분석 탭 Icons.insights 추가가 옛 SW 캐시의 tree-shaken
        # MaterialIcons font 에 codepoint 없어 빈 글리프 표시 회귀 → 영구 fix.
        # Trade-off: offline 미지원. budget-book 는 인증 필요 앱이라 무관.
        run: flutter build web --release --pwa-strategy=none --dart-define=API_BASE_URL=https://aiva-bb.duckdns.org

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/nas_key
          chmod 600 ~/.ssh/nas_key
          ssh-keyscan -p ${{ secrets.NAS_SSH_PORT }} ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package and deploy to NAS
        run: |
          cd build/web
          tar czf /tmp/bb-web.tar.gz .
          scp -O -i ~/.ssh/nas_key -P ${{ secrets.NAS_SSH_PORT }} \
            /tmp/bb-web.tar.gz ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/tmp/bb-web.tar.gz
          ssh -i ~/.ssh/nas_key -p ${{ secrets.NAS_SSH_PORT }} \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} \
            "sudo rm -rf /var/services/web_bb/* && cd /var/services/web_bb && sudo tar xzf /tmp/bb-web.tar.gz && sudo chown -R admin:users /var/services/web_bb && rm /tmp/bb-web.tar.gz && test -f /var/services/web_bb/index.html && echo 'Frontend deployed'"

  # ── Nginx vhost 동기화 (ops/nas-nginx/ 변경 시) ──
  # DSM Web Station / ssl.compress.conf 의 global gzip off 를 vhost 레벨에서 override.
  # repo 에 단일 진실원(ops/nas-nginx/aiva-bb.conf) 을 두어 DSM 업데이트/재설정 drift 방지.
  sync-nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/nas_key
          chmod 600 ~/.ssh/nas_key
          ssh-keyscan -p ${{ secrets.NAS_SSH_PORT }} ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync aiva-bb.conf to NAS + test + reload
        run: |
          scp -O -i ~/.ssh/nas_key -P ${{ secrets.NAS_SSH_PORT }} \
            ops/nas-nginx/aiva-bb.conf \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/tmp/aiva-bb.conf
          ssh -i ~/.ssh/nas_key -p ${{ secrets.NAS_SSH_PORT }} \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} \
            "set -e; \
             TARGET=/usr/local/etc/nginx/sites-available/aiva-bb.conf; \
             if ! sudo diff -q /tmp/aiva-bb.conf \$TARGET >/dev/null 2>&1; then \
               sudo cp \$TARGET \$TARGET.bak.\$(date +%Y%m%d_%H%M%S); \
               sudo mv /tmp/aiva-bb.conf \$TARGET; \
               sudo chown root:root \$TARGET; \
               sudo chmod 644 \$TARGET; \
               sudo nginx -t && sudo nginx -s reload; \
               echo 'nginx vhost reloaded'; \
             else \
               rm /tmp/aiva-bb.conf; \
               echo 'nginx vhost unchanged'; \
             fi"
